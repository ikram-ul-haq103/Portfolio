/* ══════════════════════════════════════════════════════════════════════

function useScrollReveal(threshold = 0.12) {
    const ref = useRef(null);
    const [visible, setVisible] = useState(false);
    useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const obs = new IntersectionObserver(([e]) => {
            if (e.isIntersecting) { setVisible(true); obs.disconnect(); }
        }, { threshold });
        obs.observe(el);
        return () => obs.disconnect();
    }, [threshold]);
    return [ref, visible];
}

function useTypewriter(texts, typingSpeed = 75, deletingSpeed = 38, pauseMs = 2200) {
    const [output, setOutput] = useState('');
    const [idx, setIdx]       = useState(0);
    const [charIdx, setCharIdx] = useState(0);
    const [deleting, setDeleting] = useState(false);

    useEffect(() => {
        const target = texts[idx];
        let timer;
        if (!deleting && charIdx < target.length) {
            timer = setTimeout(() => { setOutput(target.slice(0, charIdx + 1)); setCharIdx(c => c + 1); }, typingSpeed);
        } else if (!deleting && charIdx === target.length) {
            timer = setTimeout(() => setDeleting(true), pauseMs);
        } else if (deleting && charIdx > 0) {
            timer = setTimeout(() => { setOutput(target.slice(0, charIdx - 1)); setCharIdx(c => c - 1); }, deletingSpeed);
        } else if (deleting && charIdx === 0) {
            setDeleting(false);
            setIdx(i => (i + 1) % texts.length);
        }
        return () => clearTimeout(timer);
    }, [charIdx, deleting, idx, texts, typingSpeed, deletingSpeed, pauseMs]);

    return output;
}

/* Dynamic Count-Up Hook */
function useCountUp(endVal, trigger, durationMs = 1500) {
    const [count, setCount] = useState(0);
    useEffect(() => {
        if (!trigger) return;
        let startTimestamp = null;
        let reqId;
        const step = (timestamp) => {
            if (!startTimestamp) startTimestamp = timestamp;
            const progress = Math.min((timestamp - startTimestamp) / durationMs, 1);
            // Ease out cubic
            const easeOut = 1 - Math.pow(1 - progress, 3);
            setCount(Math.floor(easeOut * endVal));
            if (progress < 1) {
                reqId = requestAnimationFrame(step);
            } else {
                setCount(endVal);
            }
        };
        reqId = requestAnimationFrame(step);
        return () => cancelAnimationFrame(reqId);
    }, [trigger, endVal, durationMs]);
    return count;
}

/* Scroll Progress Hook */
function useScrollProgress() {
    const [progress, setProgress] = useState(0);
    useEffect(() => {
        const handleScroll = () => {
            const total = document.documentElement.scrollHeight - window.innerHeight;
            if (total > 0) {
                const current = window.scrollY;
                setProgress((current / total) * 100);
            }
        };
        window.addEventListener('scroll', handleScroll, { passive: true });
        return () => window.removeEventListener('scroll', handleScroll);
    }, []);
    return progress;
}

/* ══════════════════════════════════════════════════════════════════════
   REVEAL WRAPPER
══════════════════════════════════════════════════════════════════════ */
function Reveal({ children, className = '', delay = 0, scale = false }) {
    const [ref, visible] = useScrollReveal();
    const baseClass = scale ? 'reveal-scale' : 'reveal';
    return (
        <div
            ref={ref}
            className={`${baseClass} ${visible ? 'in-view' : ''} ${className}`}
            style={{ transitionDelay: visible ? `${delay}ms` : '0ms' }}
        >
            {children}
        </div>
    );
}

/* ══════════════════════════════════════════════════════════════════════
   PROJECT CARD (Interactive 3D Tilt)
══════════════════════════════════════════════════════════════════════ */
function ProjectCard({ project, onOpen }) {
    const cardRef = useRef(null);

    const onMouseMove = useCallback((e) => {
        const el  = cardRef.current;
        const box = el.getBoundingClientRect();
        const x   = e.clientX - box.left - box.width / 2;
        const y   = e.clientY - box.top  - box.height / 2;
        const rx  = (-y / box.height) * 10;
        const ry  = ( x / box.width)  * 10;
        el.style.transition = 'transform 0.08s linear';
        el.style.transform  = `perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg) translateZ(8px)`;
    }, []);

    const onMouseLeave = useCallback(() => {
        const el = cardRef.current;
        el.style.transition = 'transform 0.5s cubic-bezier(0.16,1,0.3,1)';
        el.style.transform  = 'perspective(900px) rotateX(0deg) rotateY(0deg) translateZ(0)';
    }, []);

    return (
        <div ref={cardRef} onMouseMove={onMouseMove} onMouseLeave={onMouseLeave}
            className="tilt-card flex flex-col h-full rounded-2xl border border-slate-200 dark:border-slate-800/80 bg-white dark:bg-slate-900/60 shadow-md overflow-hidden group">
            <div className="h-1 bg-gradient-to-r from-blue-500 via-indigo-500 to-purple-500 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
            <div className="flex flex-col flex-1 p-7">
                <div className="flex items-center justify-between mb-3">
                    <span className="text-xs font-mono font-semibold text-blue-600 dark:text-blue-400">{project.category}</span>
                    <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 text-xs font-semibold border border-emerald-500/20">
                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                        {project.status}
                    </span>
                </div>
                <h3 className="text-lg font-bold text-slate-900 dark:text-white mb-3 leading-snug">{project.title}</h3>
                <p className="text-sm text-slate-600 dark:text-slate-400 mb-5 flex-1 leading-relaxed line-clamp-4">{project.description}</p>
                <div className="flex flex-wrap gap-2 mb-6">
                    {project.technologies.map(t => (
                        <span key={t} className="skill-pill px-2.5 py-1 text-xs font-medium rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300">{t}</span>
                    ))}
                </div>
                <button onClick={() => onOpen(project)}
                    className="btn-primary w-full py-3 rounded-xl bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white text-sm font-semibold shadow-md shadow-blue-500/20 hover:shadow-blue-500/30 transition-all duration-300 flex items-center justify-center gap-2">
                    View Case Study
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                </button>
            </div>
        </div>
    );
}

/* ══════════════════════════════════════════════════════════════════════
   CONTACT SECTION
══════════════════════════════════════════════════════════════════════ */
function Contact() {
    const [form, setForm]   = useState({ name: '', email: '', message: '' });
    const [errors, setErrors] = useState({});
    const [status, setStatus] = useState(null); // null | 'loading' | 'success' | 'error'
    const [statusMsg, setStatusMsg] = useState('');

    const validate = () => {
        const e = {};
        if (!form.name.trim() || form.name.trim().length < 2)
            e.name = 'Name must be at least 2 characters.';
        if (!form.email.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email.trim()))
            e.email = 'Please enter a valid email address.';
        if (!form.message.trim() || form.message.trim().length < 10)
            e.message = 'Message must be at least 10 characters.';
        return e;
    };

    const handleChange = e => {
        const { name, value } = e.target;
        setForm(f => ({ ...f, [name]: value }));
        if (errors[name]) setErrors(er => ({ ...er, [name]: '' }));
    };

    const encode = (data) => {
        return Object.keys(data)
            .map(key => encodeURIComponent(key) + '=' + encodeURIComponent(data[key]))
            .join('&');
    };

    const handleSubmit = async e => {
        e.preventDefault();
        const errs = validate();
        if (Object.keys(errs).length > 0) { setErrors(errs); return; }

        setStatus('loading');
        setErrors({});

        try {
            // Netlify Form submission (POST / with urlencoded payload)
            const res = await fetch('/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: encode({
                    'form-name': 'contact',
                    ...form
                })
            });

            if (res.ok) {
                setStatus('success');
                setStatusMsg("Message sent successfully! I'll get back to you soon. 🎉");
                setForm({ name: '', email: '', message: '' });
            } else {
                // If not running on Netlify (e.g. local Node server), fallback to local backend API
                const localRes = await fetch('/api/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(form)
                });
                const localData = await localRes.json();
                if (localData.success) {
                    setStatus('success');
                    setStatusMsg(localData.message || "Message sent! I'll get back to you soon.");
                    setForm({ name: '', email: '', message: '' });
                } else {
                    setStatus('error');
                    setStatusMsg(localData.message || 'Something went wrong. Please try again.');
                }
            }
        } catch {
            setStatus('error');
            setStatusMsg(`Network error. Please email me directly at ikramulhaqq90@gmail.com.`);
        }
    };

    const isLoading = status === 'loading';

    return (
        <section id="contact" className="py-20 section-divider">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <Reveal>
                    <SectionHeading label="Get In Touch" title="Have an idea? Let's build it." />
                    <p className="text-slate-600 dark:text-slate-400 max-w-xl -mt-6 mb-10 text-base leading-relaxed">
                        Whether you're exploring an AI solution, automation workflow, or custom software project — send a message and I'll get back to you.
                    </p>
                </Reveal>

                <div className="grid lg:grid-cols-5 gap-8 lg:gap-12 items-start">
                    {/* Form */}
                    <Reveal delay={100} className="lg:col-span-3">
                        <div className="rounded-3xl border border-slate-200 dark:border-slate-800/80 bg-white dark:bg-slate-900/60 p-7 sm:p-9 shadow-xl backdrop-blur-sm">
                            <form 
                                name="contact" 
                                method="POST" 
                                data-netlify="true" 
                                data-netlify-honeypot="bot-field"
                                onSubmit={handleSubmit} 
                                noValidate 
                                className="space-y-5"
                            >
                                <input type="hidden" name="form-name" value="contact" />
                                <div hidden>
                                    <label>Don’t fill this out if you're human: <input name="bot-field" /></label>
                                </div>

                                {/* Name */}
                                <div>
                                    <label className="block text-xs font-mono font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">Name *</label>
                                    <input name="name" type="text" value={form.name} onChange={handleChange}
                                        placeholder="Your full name"
                                        className={`form-input w-full px-4 py-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 border text-slate-900 dark:text-white placeholder-slate-400 text-sm outline-none ${errors.name ? 'border-red-400 dark:border-red-500' : 'border-slate-200 dark:border-slate-700'}`}
                                    />
                                    {errors.name && <p className="text-red-500 text-xs mt-1.5 flex items-center gap-1"><span>⚠</span>{errors.name}</p>}
                                </div>

                                {/* Email */}
                                <div>
                                    <label className="block text-xs font-mono font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">Email *</label>
                                    <input name="email" type="email" value={form.email} onChange={handleChange}
                                        placeholder="your@email.com"
                                        className={`form-input w-full px-4 py-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 border text-slate-900 dark:text-white placeholder-slate-400 text-sm outline-none ${errors.email ? 'border-red-400 dark:border-red-500' : 'border-slate-200 dark:border-slate-700'}`}
                                    />

    );
}

/* ══════════════════════════════════════════════════════════════════════
   SCROLL TO TOP BUTTON
══════════════════════════════════════════════════════════════════════ */
function ScrollToTop() {
    const [show, setShow] = useState(false);
    useEffect(() => {
        const fn = () => setShow(window.scrollY > 400);
        window.addEventListener('scroll', fn, { passive: true });
        return () => window.removeEventListener('scroll', fn);
    }, []);
    return (
        <button
            onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
            className={`scroll-top fixed bottom-6 right-6 z-40 w-11 h-11 rounded-xl bg-gradient-to-br from-blue-600 to-purple-600 text-white shadow-xl shadow-blue-500/25 flex items-center justify-center transition-all duration-300 hover:scale-110 ${show ? 'visible' : ''}`}
            aria-label="Scroll to top"
        >
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 15l7-7 7 7"/>
            </svg>
        </button>
    );
}

/* ══════════════════════════════════════════════════════════════════════
   APP
══════════════════════════════════════════════════════════════════════ */
function App() {
    const [theme, setTheme] = useState('dark');

    useEffect(() => {
        const saved = localStorage.getItem('portfolio-theme') || 'dark';
        setTheme(saved);
        applyTheme(saved);
    }, []);

    function applyTheme(t) {
        const html = document.documentElement;
        const body = document.body;
        if (t === 'dark') {
            html.classList.add('dark');
            html.classList.remove('light');
            body.classList.remove('light-mode');
            body.style.backgroundColor = '#070710';
        } else {
            html.classList.remove('dark');
            html.classList.add('light');
            body.classList.add('light-mode');
            body.style.backgroundColor = '#f8fafc';
        }
    }

    const toggleTheme = () => {
        const next = theme === 'dark' ? 'light' : 'dark';
        setTheme(next);
        localStorage.setItem('portfolio-theme', next);
        applyTheme(next);
    };

    return (
        <div className="min-h-screen font-sans">
            <Navbar theme={theme} toggleTheme={toggleTheme} />
            <main>
                <Hero theme={theme} />
                <About />
                <Skills />
                <Projects />
                <DevApproach />
                <Contact />
            </main>
            <Footer />
            <ScrollToTop />
        </div>
    );
}

/* ── Mount ── */
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
