        function useIntersectionObserver(ref, options = { threshold: 0.12 }) {
            const [isVisible, setIsVisible] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) {
                        setIsVisible(true);
                        observer.disconnect();
                    }
                }, options);

                if (ref.current) {
                    observer.observe(ref.current);
                }

                return () => observer.disconnect();
            }, [ref, options]);

            return isVisible;

                                ))}
                            </div>
                        </div>
                    </section>
                </Section>
            );
        }

        // --- Contact ---
        function Contact() {
            const [formData, setFormData] = useState({
                name: '',
                email: '',
                projectType: 'AI Application',
                message: ''
            });
            const [submitted, setSubmitted] = useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                setSubmitted(true);
                setTimeout(() => setSubmitted(false), 5000);
                setFormData({ name: '', email: '', projectType: 'AI Application', message: '' });
            };

            const handleChange = (e) => {
                setFormData({ ...formData, [e.target.name]: e.target.value });
            };

            return (
                <Section id="contact">
                    <section className="py-20 border-t border-slate-200 dark:border-slate-800/80">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex items-center gap-3 mb-4">
                                <span className="text-xs font-mono font-semibold text-blue-600 dark:text-blue-400 uppercase tracking-widest">Get In Touch</span>
                            </div>
                            <h2 className="text-3xl sm:text-4xl font-extrabold text-slate-900 dark:text-white tracking-tight mb-4">Have an idea? Let's build it.</h2>
                            <div className="w-16 h-1 bg-gradient-to-r from-blue-500 to-purple-500 rounded-full mb-4"></div>
                            <p className="text-slate-600 dark:text-slate-400 max-w-2xl mb-10 text-base">
                                Whether you're exploring an AI solution, automation workflow, intelligent agent application, or custom software project, feel free to send a message.
                            </p>

                            <div className="max-w-2xl p-8 sm:p-10 rounded-3xl bg-white dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800/80 shadow-xl">
                                <form onSubmit={handleSubmit} className="space-y-6">
                                    <div>
                                        <label htmlFor="name" className="block text-xs font-mono font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">Name</label>
                                        <input
                                            type="text"
                                            id="name"
                                            name="name"
                                            value={formData.name}
                                            onChange={handleChange}
                                            required
                                            className="w-full px-4 py-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors text-sm"
                                            placeholder="Your name"
                                        />
                                    </div>

                                    <div>
                                        <label htmlFor="email" className="block text-xs font-mono font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">Email</label>
                                        <input
                                            type="email"
                                            id="email"
                                            name="email"
                                            value={formData.email}
                                            onChange={handleChange}
                                            required
                                            className="w-full px-4 py-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors text-sm"
                                            placeholder="your@email.com"
                                        />
                                    </div>

                                    <div>
                                        <label htmlFor="projectType" className="block text-xs font-mono font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">Project Category</label>
                                        <select
                                            id="projectType"
                                            name="projectType"
                                            value={formData.projectType}
                                            onChange={handleChange}
                                            className="w-full px-4 py-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors text-sm"
                                        >
                                            <option value="AI Application">AI Application</option>
                                            <option value="AI Automation">AI Automation</option>
                                            <option value="AI Agent">AI Agent</option>
                                            <option value="Voice AI">Voice AI</option>
                                            <option value="Machine Learning">Machine Learning</option>
                                            <option value="Backend/API">Backend/API</option>
                                            <option value="Other">Other</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label htmlFor="message" className="block text-xs font-mono font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider mb-2">Message</label>
                                        <textarea
                                            id="message"
                                            name="message"
                                            value={formData.message}
                                            onChange={handleChange}
                                            required
                                            rows={5}
                                            className="w-full px-4 py-3.5 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors text-sm resize-none"
                                            placeholder="Describe your project goals or requirements..."
                                        />
                                    </div>

                                    <button
                                        type="submit"
                                        className="w-full py-4 rounded-xl bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold text-sm shadow-xl shadow-blue-500/25 transition-all hover:scale-[1.01] active:scale-100"
                                    >
                                        Send Message
                                    </button>

                                    {submitted && (
                                        <div className="p-4 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-600 dark:text-emerald-400 text-sm font-semibold text-center flex items-center justify-center gap-2">
                                            <span>✓</span> Message sent successfully! I will respond shortly.
                                        </div>
                                    )}
                                </form>
                            </div>
                        </div>
                    </section>
                </Section>
            );
        }

        // --- Footer ---
        function Footer() {
            return (
                <footer className="border-t border-slate-200 dark:border-slate-800/80 py-10 bg-slate-50/50 dark:bg-slate-950/50">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex flex-col sm:flex-row items-center justify-between gap-6">
                            <div className="text-center sm:text-left">
                                <div className="text-base font-extrabold text-slate-900 dark:text-white">{PROFILE.name}</div>
                                <div className="text-xs font-mono text-slate-500 dark:text-slate-400 mt-1">{PROFILE.title}</div>
                            </div>
                            <div className="flex items-center gap-6 text-sm font-medium">
                                <a href={PROFILE.social.github} target="_blank" rel="noopener noreferrer" className="text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white transition-colors">
                                    GitHub
                                </a>
                                <a href={PROFILE.social.linkedin} target="_blank" rel="noopener noreferrer" className="text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white transition-colors">
                                    LinkedIn
                                </a>
                                <a href={PROFILE.social.email} className="text-slate-600 dark:text-slate-400 hover:text-blue-600 dark:hover:text-white transition-colors">
                                    Email
                                </a>
                            </div>
                        </div>
                        <div className="text-center text-xs text-slate-400 dark:text-slate-500 mt-8 pt-6 border-t border-slate-200 dark:border-slate-800/60 font-mono">
                            © {new Date().getFullYear()} {PROFILE.name}. All rights reserved.
                        </div>
                    </div>
                </footer>
            );
        }

        // ============================================================
        // MAIN APP COMPONENT
        // ============================================================
        function App() {
            const [theme, setTheme] = useState('dark');

            useEffect(() => {
                const savedTheme = localStorage.getItem('theme') || 'dark';
                setTheme(savedTheme);
                if (savedTheme === 'dark') {
                    document.documentElement.classList.add('dark');
                    document.documentElement.classList.remove('light');
                    document.body.style.backgroundColor = '#0a0a0f';
                } else {
                    document.documentElement.classList.add('light');
                    document.documentElement.classList.remove('dark');
                    document.body.style.backgroundColor = '#f8fafc';
                }
            }, []);

            const toggleTheme = () => {
                const newTheme = theme === 'dark' ? 'light' : 'dark';
                setTheme(newTheme);
                localStorage.setItem('theme', newTheme);
                if (newTheme === 'dark') {
                    document.documentElement.classList.add('dark');
                    document.documentElement.classList.remove('light');
                    document.body.style.backgroundColor = '#0a0a0f';
                } else {
                    document.documentElement.classList.add('light');
                    document.documentElement.classList.remove('dark');
                    document.body.style.backgroundColor = '#f8fafc';
                }
            };

            return (
                <div className="min-h-screen font-sans selection:bg-blue-500 selection:text-white">
                    <Navbar theme={theme} toggleTheme={toggleTheme} />
                    <main>
                        <Hero theme={theme} />
                        <About />
                        <Capabilities />
                        <Skills />
                        <Projects />
                        <WhatIBuild />
                        <DevApproach />
                        <Contact />
                    </main>
                    <Footer />
                </div>
            );
        }

        // ============================================================
        // MOUNT REACT APP
        // ============================================================
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
